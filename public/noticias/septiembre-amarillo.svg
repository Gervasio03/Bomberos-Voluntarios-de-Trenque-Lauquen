<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" width="540" height="720">
  <defs>
    <!-- Heart template matching exact proportions -->
    <g id="heart-shape">
      <path d="M 0 -22 C -22 -52 -58 -22 -58 15 C -58 52 -22 82 0 112 C 22 82 58 52 58 15 C 58 -22 22 -52 0 -22 Z" fill="#ebc238" />
    </g>
    <filter id="ribbon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#554400" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Warm background matching the original flyer -->
  <rect width="540" height="720" fill="#f5df7a" />

  <!-- Background Hearts accurately positioned according to the image -->
  <!-- Top left & middle & right -->
  <use href="#heart-shape" transform="translate(70, 75) rotate(-18) scale(1.4)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(325, 35) rotate(22) scale(1.15)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(500, 70) rotate(35) scale(0.95)" opacity="0.95" />

  <!-- Giant center heart behind the yellow ribbon -->
  <use href="#heart-shape" transform="translate(265, 230) scale(3.55)" opacity="0.95" />

  <!-- Mid left and right -->
  <use href="#heart-shape" transform="translate(30, 480) rotate(25) scale(1.4)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(515, 435) rotate(-15) scale(1.2)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(530, 230) rotate(25) scale(1.1)" opacity="0.95" />

  <!-- Bottom hearts -->
  <use href="#heart-shape" transform="translate(145, 680) rotate(-12) scale(1.5)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(470, 730) rotate(18) scale(1.65)" opacity="0.95" />
  <use href="#heart-shape" transform="translate(50, 930) rotate(-15) scale(1.3)" opacity="0.95" />

  <!-- AWARENESS RIBBON -->
  <g transform="translate(268, 255) scale(1.18)" filter="url(#ribbon-shadow)">
    <!-- Right leg going back/under -->
    <path d="M 12 -5 L 115 78 L 72 145 L -32 55 Z" fill="#eab321" stroke="#231b15" stroke-width="6.5" stroke-linejoin="round" />
    
    <!-- Dark loop inner cutout -->
    <path d="M 0 -85 C 36 -85 40 -40 0 10 C -40 -40 -36 -85 0 -85 Z" fill="#231b15" />
    
    <!-- Left leg and main upper loop coming forward -->
    <path d="M 0 -105 C -62 -105 -74 -35 -28 22 L -115 142 L -65 178 L 28 58 C 72 -5 62 -105 0 -105 Z" fill="#f7cf2c" stroke="#231b15" stroke-width="6.5" stroke-linejoin="round" />
    <path d="M 0 -85 C 36 -85 40 -40 0 10 C -40 -40 -36 -85 0 -85 Z" fill="#231b15" stroke="#231b15" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Text Box 1: SEPTIEMBRE -->
  <g transform="translate(270, 508)">
    <rect x="-140" y="-32" width="280" height="64" rx="12" fill="#fffbe3" opacity="0.97" />
    <text x="0" y="11" font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif" font-weight="900" font-size="33" fill="#2b2219" text-anchor="middle" letter-spacing="4">SEPTIEMBRE</text>
  </g>

  <!-- Text Box 2: AMARILLO -->
  <g transform="translate(270, 584)">
    <rect x="-125" y="-32" width="250" height="64" rx="12" fill="#fffbe3" opacity="0.97" />
    <text x="0" y="11" font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif" font-weight="900" font-size="33" fill="#2b2219" text-anchor="middle" letter-spacing="4">AMARILLO</text>
  </g>

  <!-- Text Box 3: MES DE LA PREVENCIÓN DEL SUICIDIO -->
  <g transform="translate(270, 665)">
    <rect x="-225" y="-31" width="450" height="62" rx="12" fill="#fffbe3" opacity="0.97" />
    <text x="0" y="-7" font-family="'Arial', 'Helvetica', sans-serif" font-weight="800" font-size="19" fill="#2b2219" text-anchor="middle" letter-spacing="3.5">MES DE LA PREVENCIÓN</text>
    <text x="0" y="20" font-family="'Arial', 'Helvetica', sans-serif" font-weight="800" font-size="19" fill="#2b2219" text-anchor="middle" letter-spacing="3.5">DEL SUICIDIO</text>
  </g>
</svg>
